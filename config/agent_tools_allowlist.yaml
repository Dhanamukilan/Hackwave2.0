allowlisted_tools:
  - name: "get_test_history"
    description: "Returns chronological execution records for a test_id"
    category: "history"
  - name: "get_failure_history"
    description: "Returns prior occurrences of a fingerprint_id"
    category: "history"
  - name: "search_similar_failures"
    description: "Returns top-k Qdrant matches and similarity scores for an error embedding"
    category: "vector_search"
  - name: "get_commit_diff"
    description: "Returns changed files and git diff hunks for a commit_sha"
    category: "git"
  - name: "get_recent_commits"
    description: "Returns recent commit list for repository since a given timestamp or commit"
    category: "git"
  - name: "get_changed_files"
    description: "Returns file paths and component mapping for a commit_sha"
    category: "git"
  - name: "get_component_owner"
    description: "Returns owner/team record for a component_id"
    category: "ownership"
  - name: "get_environment_history"
    description: "Returns runner OS, version, and environment variance for a test_id"
    category: "environment"
  - name: "get_deployment_history"
    description: "Returns recent service deployments and correlated timestamps"
    category: "deployment"
  - name: "calculate_flakiness"
    description: "Computes derived historical flakiness features for a test_id"
    category: "flakiness"
  - name: "get_runtime_evidence"
    description: "Returns runtime logs, OTel traces, or container telemetry if deployed"
    category: "runtime"
