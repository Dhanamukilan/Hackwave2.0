# Skeleton — fill in build contexts as backend/frontend are implemented.
version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ag004}
      POSTGRES_USER: ${POSTGRES_USER:-ag004}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]

  backend:
    build: ../../backend
    env_file: ../../.env
    ports: ["8000:8000"]
    depends_on: [postgres, qdrant, ollama]

  frontend:
    build: ../../frontend
    ports: ["5173:5173"]
    depends_on: [backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes: ["../../observability/otel_collector/config.yaml:/etc/otelcol/config.yaml"]
    ports: ["4318:4318"]

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
