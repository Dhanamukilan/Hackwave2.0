apiVersion: apps/v1
kind: Deployment
metadata:
  name: ag004-backend
  labels:
    app: ag004
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ag004
      component: backend
  template:
    metadata:
      labels:
        app: ag004
        component: backend
    spec:
      containers:
        - name: backend
          image: ag004-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ag004-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ag004-frontend
  labels:
    app: ag004
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ag004
      component: frontend
  template:
    metadata:
      labels:
        app: ag004
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ag004-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
