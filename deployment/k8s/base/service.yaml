apiVersion: v1
kind: Service
metadata:
  name: ag004-postgres-service
  labels:
    app: ag004
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: ag004
    component: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ag004-qdrant-service
  labels:
    app: ag004
    component: qdrant
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: ag004
    component: qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: ag004-backend-service
  labels:
    app: ag004
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ag004
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: ag004-frontend-service
  labels:
    app: ag004
    component: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5173
      name: http
  selector:
    app: ag004
    component: frontend
