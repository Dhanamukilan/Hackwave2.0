apiVersion: v1
kind: Service
metadata:
  name: ag004-backend-service
  labels:
    app: ag004
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ag004
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: ag004-frontend-service
  labels:
    app: ag004
    component: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5173
      name: http
  selector:
    app: ag004
    component: frontend
